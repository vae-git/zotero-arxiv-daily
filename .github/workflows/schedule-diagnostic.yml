name: Temporary schedule diagnostic
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions: {}
jobs:
  observe-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger and time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Event: $EVENT_NAME"
          date -u
